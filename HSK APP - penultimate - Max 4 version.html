*,*::before,*::after{box-sizing:inherit}
.appbox{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.65}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
.seal{display:inline-grid;place-items:center;width:44px;height:44px;border:2.5px solid var(--seal);color:var(--seal);font:700 26px/1 var(--serif);transform:rotate(-5deg);border-radius:4px;flex:none}

/* Home */
.home{max-width:860px;margin:0 auto;padding:40px 20px 80px}
.home .top{display:flex;align-items:center;gap:16px}
.home h1{font:700 clamp(2rem,6.5vw,3.5rem)/1.15 var(--serif);margin:24px 0 8px;letter-spacing:.04em}
.home .lede{color:var(--muted);max-width:56ch;margin:0 0 32px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:40px}
.mode{display:block;text-align:left;background:var(--sheet);border:1.5px solid var(--ink);border-radius:6px;padding:20px;cursor:pointer}
.mode:hover{background:var(--tint)}
.mode b{display:block;font:700 1.35rem var(--serif);margin-bottom:4px}
.mode span{color:var(--muted);font-size:.95rem}
.outline{border-top:1.5px solid var(--ink)}
.outline .row{display:grid;grid-template-columns:130px 1fr;gap:6px 20px;padding:16px 0;border-bottom:1px solid var(--line)}
.outline .row h3{margin:0;font:700 1.4rem var(--serif)}
.outline .row h3 small{display:block;font:400 .85rem var(--sans);color:var(--muted)}
.outline .row p{margin:0}
.outline .row .cnt{color:var(--muted);font-size:.9rem}
.note{color:var(--muted);font-size:.9rem;margin-top:24px}

/* Shell */
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);gap:28px;max-width:1120px;margin:0 auto;padding:24px 20px 80px;align-items:start}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.brand .seal{width:36px;height:36px;font-size:21px}
.brand b{font:700 1.05rem/1.2 var(--serif)}
.brand small{display:block;color:var(--muted);font-size:.78rem}
.nav{list-style:none;margin:0;padding:0;border-top:1.5px solid var(--ink)}
.nav li{border-bottom:1px solid var(--line)}
.nav button{display:flex;justify-content:space-between;align-items:baseline;gap:8px;width:100%;background:none;border:0;border-left:4px solid transparent;padding:10px 8px 10px 10px;text-align:left;cursor:pointer}
.nav button:hover{background:var(--tint)}
.nav button[aria-current="true"]{border-left-color:var(--seal);background:var(--tint);font-weight:700}
.nav .zh{font:700 1.1rem var(--serif)}
.nav .en{display:block;font-size:.76rem;color:var(--muted);font-weight:400}
.nav .st{font-size:.85rem;color:var(--muted);white-space:nowrap}
.clock{display:flex;justify-content:space-between;align-items:baseline;color:var(--muted);font-size:.9rem}
.clock b{font:500 1.3rem var(--serif);color:var(--ink);font-variant-numeric:tabular-nums}
.submit{background:var(--ink);color:var(--sheet);border:0;border-radius:6px;padding:12px 16px;font-weight:700;cursor:pointer;width:100%}
.submit:hover{opacity:.9}
.warn{margin:0;color:var(--seal);font-size:.9rem}

/* Paper */
.paper{background:var(--sheet);border:1px solid var(--line);border-top:3px solid var(--seal);border-radius:2px;padding:28px 32px 36px;min-width:0}
.sec-head h2{font:700 clamp(1.8rem,5vw,2.4rem)/1.2 var(--serif);margin:0}
.sec-head h2 small{font:400 1rem var(--sans);color:var(--muted);margin-left:12px}
.sec-head p{margin:8px 0 0;color:var(--muted)}
.part{margin-top:36px}
.part-h{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;border-bottom:1.5px solid var(--ink);padding-bottom:6px;margin-bottom:6px}
.part-h h3{margin:0;font:700 1.25rem var(--serif)}
.part-h span{color:var(--muted);font-size:.88rem}
.part-note{margin:6px 0 14px;font-family:var(--serif);font-size:1.02rem}
.bank{display:flex;flex-wrap:wrap;gap:6px 22px;background:var(--tint2);border:1px solid var(--line);border-radius:4px;padding:10px 14px;margin:12px 0;font-family:var(--serif);font-size:1.1rem}
.bank b{font:500 .9rem var(--sans);color:var(--muted);margin-right:6px}
.passage{font-family:var(--serif);font-size:1.08rem;line-height:1.95;border-left:3px solid var(--ink);background:var(--tint2);padding:12px 16px;margin:14px 0 4px;text-indent:2em}
details.tr{margin:6px 0 0;font-size:.92rem;color:var(--muted)}
details.tr summary{cursor:pointer}

.q{padding:18px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:44px minmax(0,1fr);gap:0 6px}
.q:last-child{border-bottom:0}
.q .no{font:700 1.15rem var(--serif);padding-top:2px}
.q .body{min-width:0}
.stem{font-family:var(--serif);font-size:1.12rem;margin:0 0 10px}
.stem.latin{font-family:Georgia,"Times New Roman",serif;font-size:1.08rem}
.opts{display:flex;flex-direction:column;gap:2px}
.opts.row{flex-direction:row;flex-wrap:wrap;gap:4px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:none;color:inherit;border:1.5px solid transparent;border-radius:8px;padding:6px 10px;cursor:pointer}
.opt.compact{width:auto;padding:4px}
.opt:hover:not(:disabled){background:var(--tint)}
.opt:disabled{cursor:default;color:inherit}
.opt .t{font-family:var(--serif);font-size:1.05rem;padding-top:2px}
.b{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;font:500 .85rem var(--sans);background:transparent}
.opt.sel .b{background:var(--pencil);border-color:var(--pencil);color:var(--sheet)}
.opt.ok{border-color:var(--ok)}
.opt.ok .b{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--seal)}
.opt.bad .b{background:var(--seal);border-color:var(--seal);color:#fff}
.audio{display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.play{background:var(--tint);border:1.5px solid var(--ink);border-radius:999px;padding:6px 18px;cursor:pointer;font-weight:500}
.play:hover{background:var(--line)}
.audio .hint{color:var(--muted);font-size:.85rem}
.script{background:var(--tint2);border:1px dashed var(--line);border-radius:4px;padding:8px 12px;margin:0 0 10px;font-size:.98rem}
.script p{margin:2px 0}
.script .zh{font-family:var(--serif)}
.script .en{color:var(--muted);font-size:.9rem}

.seq .pool{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.seq .pool.list{flex-direction:column;align-items:stretch}
.chip{display:inline-flex;gap:10px;align-items:center;background:var(--sheet);border:1.5px solid var(--ink);border-radius:6px;padding:6px 12px;cursor:pointer;font-family:var(--serif);font-size:1.08rem;text-align:left}
.chip:hover:not(:disabled){background:var(--tint)}
.chip.used{opacity:.35;border-style:dashed}
.chip:disabled{cursor:default;color:inherit}
.chip .b{width:26px;height:26px;font-size:.8rem}
.chip.put{background:var(--tint);border-color:var(--pencil)}
.line{min-height:48px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:2px solid var(--ink);padding:6px 2px}
.line .ph{color:var(--muted);font-size:.92rem}
.mini{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:.88rem;padding:4px 0}
textarea.ans{width:100%;min-height:76px;resize:vertical;font:1.1rem/1.7 var(--serif);color:var(--ink);background:var(--tint2);border:1.5px solid var(--ink);border-radius:6px;padding:10px 12px}
textarea.ans:disabled{opacity:.85}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.pill{border:1.5px solid var(--seal);color:var(--seal);border-radius:4px;padding:0 10px;font:500 1rem var(--serif)}
.actions{margin-top:10px;display:flex;gap:12px;align-items:center}
.btn{background:var(--sheet);border:1.5px solid var(--ink);border-radius:6px;padding:6px 16px;cursor:pointer;font-weight:500}
.btn:hover{background:var(--tint)}
.btn.primary{background:var(--ink);color:var(--sheet)}

.fb{margin-top:12px;border-left:4px solid var(--ok);background:var(--tint2);padding:8px 14px;font-size:.96rem}
.fb.bad{border-left-color:var(--seal)}
.fb .v{font-weight:700}
.fb.ok .v{color:var(--ok)}
.fb.bad .v{color:var(--seal)}
.fb p{margin:3px 0}
.fb .zh{font-family:var(--serif);font-size:1.05rem}
.keys{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}
.keys span{font:500 .95rem var(--serif);padding:0 8px;border-radius:4px;border:1px solid var(--line)}
.keys .y{border-color:var(--ok);color:var(--ok)}
.keys .n{border-color:var(--seal);color:var(--seal)}

.pager{display:flex;justify-content:space-between;gap:12px;margin-top:32px}
.result{border:1.5px solid var(--ink);border-radius:4px;padding:20px;margin:20px 0 4px}
.result .score{font:700 clamp(2.4rem,8vw,3.6rem)/1 var(--serif)}
.result .score small{font-size:1.2rem;color:var(--muted);font-weight:500}
.result .verdict{margin:6px 0 16px;color:var(--muted)}
.rrow{display:grid;grid-template-columns:96px 1fr 64px;gap:12px;align-items:center;margin:6px 0}
.rrow .bar{height:10px;background:var(--tint);border-radius:5px;overflow:hidden}
.rrow .bar i{display:block;height:100%;background:var(--ok)}
.rrow .nm{font-family:var(--serif);font-weight:700}
.rrow .sc{text-align:right;font-variant-numeric:tabular-nums}
.only-wrong .q.is-ok{display:none}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}

@media (max-width:860px){

    case 'tf':case 'mcq':return a===q.answer;
    case 'order':return a.length===q.frags.length&&a.map(i=>L[i]).join('')===q.answer;
    case 'build':return a.length===q.frags.length&&q.answers.map(norm).includes(norm(a.map(i=>q.frags[i]).join('')));
    case 'write':return writeCheck(q).ok;
  }
  return false;
}
const isCorrect=q=>!!S.override[q.id]||auto(q);
const locked=q=>S.submitted||(S.mode==='practice'&&!!S.revealed[q.id]);
const fb=q=>S.submitted||(S.mode==='practice'&&!!S.revealed[q.id]);

/* ============ AUDIO ============ */
let playTok=0;
function playAudio(q,btn){
  if(!TTS)return;
  if(btn.dataset.on==='1'){playTok++;speechSynthesis.cancel();btn.dataset.on='0';btn.textContent='▶ 播放';return;}
  speechSynthesis.cancel();
  const tok=++playTok;
  const lines=q.audio.split('|');const queue=[];
  for(let r=0;r<2;r++)lines.forEach(l=>queue.push(l));
  const v=zhVoice();
  btn.dataset.on='1';btn.textContent='■ 停止';
  const reset=()=>{if(tok===playTok){btn.dataset.on='0';btn.textContent='▶ 播放';}};
  queue.forEach((l,i)=>{
    let pitch=1,t=l;
    if(/^女：/.test(l)){pitch=1.3;t=l.slice(2);}else if(/^男：/.test(l)){pitch=0.75;t=l.slice(2);}
    const u=new SpeechSynthesisUtterance(t);
    u.lang='zh-CN';if(v)u.voice=v;u.rate=0.85;u.pitch=pitch;
    if(i===queue.length-1)u.onend=reset;
    u.onerror=reset;
    speechSynthesis.speak(u);
  });
}

/* ============ QUESTION RENDERING ============ */
function pick(q,val){
  if(locked(q))return;
  S.answers[q.id]=val;
  if(S.mode==='practice')S.revealed[q.id]=true;
  refreshQ(q);
}
function optBtn(q,val,label,text,correct,compact){
  const sel=S.answers[q.id]===val,f=fb(q);
  let c='opt'+(compact?' compact':'');
  if(f){if(val===correct)c+=' ok';else if(sel)c+=' bad';}else if(sel)c+=' sel';
  return h('button',{type:'button',class:c,disabled:locked(q),'aria-pressed':String(sel),'aria-label':compact?label+' '+text:null,onclick:()=>pick(q,val)},
    h('span',{class:'b'},label),text&&!compact?h('span',{class:'t'},text):null);
}
function audioBlock(q){
  const showScript=fb(q)||!TTS||noZh();
  const wrap=h('div');
  const sc=h('div',{class:'script',style:showScript?null:'display:none'},
    q.audio.split('|').map(l=>h('p',{class:'zh'},l)),
    q.tr?h('p',{class:'en'},q.tr):null);
  if(TTS){
    const btn=h('button',{type:'button',class:'play','data-on':'0',onclick:()=>playAudio(q,btn)},'▶ 播放');
    const au=h('div',{class:'audio'},btn,h('span',{class:'hint'},'播放两遍'));
    if(!showScript){
      const tb=h('button',{type:'button',class:'mini',onclick:()=>{const hid=sc.style.display==='none';sc.style.display=hid?'':'none';tb.textContent=hid?'隐藏原文 / Hide transcript':'显示原文 / Show transcript';}},'显示原文 / Show transcript');
      au.append(tb);
    }
    wrap.append(au);
  }else{
    wrap.append(h('p',{class:'hint'},'此浏览器不支持语音朗读，已显示原文。'));
  }
  wrap.append(sc);
  return wrap;
}
function seqUI(q){
  const ans=S.answers[q.id]||[],lk=locked(q),isOrder=q.type==='order';
  const pool=h('div',{class:'pool'+(isOrder?' list':'')});
  q.frags.forEach((f,i)=>{
    const used=ans.includes(i);
    pool.append(h('button',{type:'button',class:'chip'+(used?' used':''),disabled:lk||used,onclick:()=>{S.answers[q.id]=[...ans,i];refreshQ(q);}},
      isOrder?[h('span',{class:'b'},L[i]),h('span',null,f)]:f));
  });
  const line=h('div',{class:'line','aria-label':'你的答案'});
  ans.forEach((i,k)=>line.append(h('button',{type:'button',class:'chip put',disabled:lk,title:'点击撤销',onclick:()=>{S.answers[q.id]=ans.filter((_,j)=>j!==k);refreshQ(q);}},isOrder?L[i]:q.frags[i])));
  if(!ans.length)line.append(h('span',{class:'ph'},isOrder?'点击上面的句子，按顺序排列':'点击上面的词语，组成句子'));
  const wrap=h('div',{class:'seq'},pool,line);
  if(ans.length&&!lk)wrap.append(h('button',{type:'button',class:'mini',onclick:()=>{S.answers[q.id]=[];refreshQ(q);}},'清空重来'));
  return wrap;
}
function writeUI(q){
  const ta=h('textarea',{class:'ans',lang:'zh-CN',placeholder:'在这里输入汉字……',disabled:locked(q),'aria-label':'你的答案'});
  ta.value=S.answers[q.id]||'';
  ta.addEventListener('input',()=>{S.answers[q.id]=ta.value;updateNav();});
  return h('div',null,
    q.hint?h('div',{class:'pills'},q.hint.map(w=>h('span',{class:'pill'},w))):null,
    ta);
}
function feedback(q){
  const ok=isCorrect(q),has=answered(q);
  const box=h('div',{class:'fb '+(ok?'ok':'bad'),'aria-live':'polite'});
  box.append(h('p',null,h('span',{class:'v'},ok?'✓ 正确':(has?'✗ 不对':'— 未作答'))));
  if(q.type==='tf'){
    if(!ok)box.append(h('p',null,'正确答案：',h('b',null,q.answer?'✓ 对':'✗ 错')));
  }else if(q.type==='mcq'){
    if(!ok)box.append(h('p',{class:'zh'},'正确答案：'+L[q.answer]+(q.bank?'  '+q.options[q.answer]:'  '+q.options[q.answer])));
    else if(q.bank)box.append(h('p',{class:'zh'},q.options[q.answer]));
  }else if(q.type==='order'){
    const idx=[...q.answer].map(c=>L.indexOf(c));
    if(!ok)box.append(h('p',null,'正确顺序：',h('b',null,[...q.answer].join(' → '))));
    box.append(h('p',{class:'zh'},q.model||(idx.map(i=>q.frags[i]).join('，')+'。')));
  }else if(q.type==='build'){
    box.append(h('p',{class:'zh'},'参考答案：'+q.model));
  }else if(q.type==='write'){
    const c=has?writeCheck(q):{found:q.keys.map(()=>false),lenOk:false};
    box.append(h('div',{class:'keys'},
      q.keys.map((k,i)=>h('span',{class:c.found[i]?'y':'n'},(c.found[i]?'✓ ':'✗ ')+[].concat(k)[0])),
      q.minLen?h('span',{class:c.lenOk?'y':'n'},(c.lenOk?'✓ ':'✗ ')+'至少'+q.minLen+'字'):null));
    box.append(h('p',{class:'zh'},'参考答案：'+q.model));
    box.append(h('button',{type:'button',class:'mini',onclick:()=>{S.override[q.id]=!S.override[q.id];refreshQ(q);updateNav();if(S.submitted){syncRecord();renderSection(S.cur,true);}}},
      S.override[q.id]?'撤销：我的答案其实不对':'我的答案意思也对，算我对'));
  }
  if(q.note)box.append(h('p',{class:'en'},q.note));
  if(q.type==='tf'&&q.tr)box.append(h('p',{class:'en'},q.tr));
  if(q.type==='mcq'&&q.audio&&q.tr)box.append(h('p',{class:'en'},q.tr));
  return box;
}
function renderQ(q){
  const f=fb(q);
  const body=h('div',{class:'body'});
  if(q.audio)body.append(audioBlock(q));
  if(q.type==='tf'){
    body.append(h('p',{class:'stem'},'★ '+q.text));
    body.append(h('div',{class:'opts row'},optBtn(q,true,'✓','对',q.answer),optBtn(q,false,'✗','错',q.answer)));
  }else if(q.type==='mcq'){
    const latin=/^[A-Za-z]/.test(q.options[0]);
    body.append(h('p',{class:'stem'},q.prompt));
    if(q.hint)body.append(h('p',{class:'qhint'},q.hint));
    if(q.bank)body.append(h('div',{class:'opts row'},q.options.map((o,i)=>optBtn(q,i,L[i],o,q.answer,true))));
    else body.append(h('div',{class:'opts'},q.options.map((o,i)=>{const b=optBtn(q,i,L[i],o,q.answer);if(latin)b.querySelector('.t').style.fontFamily='Georgia,serif';return b;})));
  }else if(q.type==='order'||q.type==='build'){
    body.append(seqUI(q));
  }else if(q.type==='write'){
    body.append(h('p',{class:'stem'+(q.latin?' latin':'')},q.prompt));
    body.append(writeUI(q));
  }
  if(S.mode==='practice'&&!f&&(q.type==='order'||q.type==='build'||q.type==='write')){
    body.append(h('div',{class:'actions'},h('button',{type:'button',class:'btn primary',onclick:()=>{S.revealed[q.id]=true;refreshQ(q);}},'检查答案')));
  }
  if(f)body.append(feedback(q));
  const okc=S.submitted&&isCorrect(q)?' is-ok':'';
  return h('article',{class:'q'+okc,id:q.id},h('div',{class:'no'},String(q.no)),body);
}
function refreshQ(q){
  const old=document.getElementById(q.id);
  if(old)old.replaceWith(renderQ(q));
  updateNav();
}

/* ============ SECTION / SHELL RENDERING ============ */
function renderBlock(b,showTr){
  const out=[];
  if(b.bank)out.push(h('div',{class:'bank'},b.bank.map((w,i)=>h('span',null,h('b',null,L[i]),w))));
  if(b.passage){
    out.push(h('p',{class:'passage'},b.passage));
    if(showTr&&b.tr)out.push(h('details',{class:'tr'},h('summary',null,'English'),h('p',null,b.tr)));
  }
  b.items.forEach(q=>out.push(renderQ(q)));
  return out;
}
const secIdx=q=>SECTIONS.findIndex(s=>s.id===q.sec);
function ansText(q){
  const a=S.answers[q.id];
  if(!answered(q))return '未作答 / no answer';
  if(q.type==='tf')return a?'✓ 对':'✗ 错';
  if(q.type==='mcq')return L[a]+'  '+q.options[a];
  if(q.type==='order')return a.map(i=>L[i]).join(' → ');
  if(q.type==='build')return a.map(i=>q.frags[i]).join('');
  return String(a);
}
function rightText(q){
  if(q.type==='tf')return q.answer?'✓ 对':'✗ 错';
  if(q.type==='mcq')return L[q.answer]+'  '+q.options[q.answer];
  if(q.type==='order')return [...q.answer].join(' → ')+(q.model?'　'+q.model:'');
  return q.model||(q.answers&&q.answers[0])||'';
}
function mistakesEl(){
  const bad=ALL.filter(q=>!isCorrect(q));
  const box=h('details',{class:'mist',open:'open'},h('summary',null,'错题回顾 / Review of mistakes（'+bad.length+'）'));
  if(!bad.length){box.append(h('p',{class:'cnt'},'全部答对，没有错题！ No mistakes.'));return box;}
  bad.forEach(q=>{
    const stem=q.type==='tf'?q.text:(q.prompt||q.text||(q.frags?q.frags.join(' / '):''));
    box.append(h('div',{class:'mrow'},
      h('div',null,h('b',null,'第 '+q.no+' 题'),h('span',{class:'cnt'},'　'+((SECTIONS[secIdx(q)]||{}).zh||''))),
      q.audio?h('div',{class:'script'},q.audio.split('|').map(l=>h('p',{class:'zh'},l)),q.tr?h('p',{class:'en'},q.tr):null):null,
      stem?h('p',{class:'zh'},stem):null,
      h('p',null,'你的答案：',h('span',{class:'bad-t'},ansText(q))),
      h('p',null,'正确答案：',h('b',{class:'ok-t'},rightText(q))),
      q.note?h('p',{class:'en'},q.note):null,
      h('button',{type:'button',class:'mini',onclick:()=>{renderSection(secIdx(q),true);const el=document.getElementById(q.id);if(el)el.scrollIntoView({block:'center'});}},'去看这道题 / Go to question')));
  });
  return box;
}
function summaryEl(){
  const per=SECTIONS.map(s=>{const qs=ALL.filter(q=>q.sec===s.id);return {s,ok:qs.filter(isCorrect).length,n:qs.length};});
  const ok=per.reduce((a,b)=>a+b.ok,0),n=ALL.length,pct=Math.round(ok/n*100);
  const verdict=pct>=90?'非常好！':pct>=70?'不错，继续保持。':pct>=50?'还可以，多练习会更好。':'别着急，把错题再做一遍。';
  return h('section',{class:'result'},
    h('div',{class:'score'},String(ok),h('small',null,' / '+n+'　'+pct+'%')),
    h('p',{class:'verdict'},verdict+(S.elapsed?'　用时 '+S.elapsed:'')),
    h('p',{class:'cnt',style:'margin:0 0 12px'},S.review?'这是已保存的测试记录。':'这次成绩和题目已保存到“测试记录”。'),
    per.map(r=>h('div',{class:'rrow'},h('span',{class:'nm'},r.s.zh),h('div',{class:'bar'},h('i',{style:'width:'+(r.n?r.ok/r.n*100:0)+'%'})),h('span',{class:'sc'},r.ok+' / '+r.n))),
    mistakesEl(),
    h('div',{class:'tools'},
      h('button',{type:'button',class:'btn',id:'onlyWrong',onclick:()=>{S.onlyWrong=!S.onlyWrong;$('#paper').classList.toggle('only-wrong',S.onlyWrong);$('#onlyWrong').textContent=S.onlyWrong?'显示全部题目':'只看错题';}},S.onlyWrong?'显示全部题目':'只看错题'),
      endBtns()));
}
function renderSection(i,keepScroll){
  S.cur=i;
  const sec=SECTIONS[i];
  const paper=$('#paper');
  paper.className='paper'+(S.onlyWrong?' only-wrong':'');
  paper.replaceChildren();
  if(S.submitted)paper.append(summaryEl());
  paper.append(h('header',{class:'sec-head'},h('h2',null,sec.zh,h('small',null,sec.en)),h('p',null,sec.intro)));
  const showTr=S.submitted||S.mode==='practice';
  sec.parts.forEach(p=>{
    const part=h('section',{class:'part'},
      h('div',{class:'part-h'},h('h3',null,p.title),h('span',null,'第 '+p.from+(p.to>p.from?'–'+p.to:'')+' 题')),
      h('p',{class:'part-note'},p.note));
    p.blocks.forEach(b=>renderBlock(b,showTr).forEach(el=>part.append(el)));
    paper.append(part);
  });
  const pager=h('div',{class:'pager'},
    i>0?h('button',{type:'button',class:'btn',onclick:()=>go(i-1)},'← '+SECTIONS[i-1].zh):h('span'),
    i<SECTIONS.length-1?h('button',{type:'button',class:'btn primary',onclick:()=>go(i+1)},SECTIONS[i+1].zh+' →'):
      (S.submitted?h('span'):h('button',{type:'button',class:'btn primary',onclick:submit},'交卷')));
  paper.append(pager);
  updateNav();
  if(!keepScroll)window.scrollTo({top:0});
}
function go(i){renderSection(i);}
function updateNav(){
  const nav=$('#nav');if(!nav)return;
  nav.replaceChildren(...SECTIONS.map((s,i)=>{
    const qs=ALL.filter(q=>q.sec===s.id);
    const st=S.submitted?qs.filter(isCorrect).length+'/'+qs.length:qs.filter(answered).length+'/'+qs.length;
    return h('li',null,h('button',{type:'button','aria-current':String(i===S.cur),onclick:()=>go(i)},
      h('span',{class:'zh'},s.zh,h('span',{class:'en'},s.en)),h('span',{class:'st'},st)));
  }));
}
function submit(){
  if(S.submitted)return;
  const un=ALL.filter(q=>!answered(q)).length;
  const w=$('#warn');
  if(un&&!S.warn){S.warn=true;if(w)w.textContent='还有 '+un+' 题没有作答。再点一次“交卷”提交。';return;}
  S.submitted=true;
  clearInterval(S.tm);
  S.elapsed=$('#timer')?$('#timer').textContent:'';
  const sb=$('#submit');if(sb)sb.remove();
  if(w)w.textContent='';
  recordTest();
  renderSection(S.cur);
}
function startTimer(){
  clearInterval(S.tm);
  S.tm=setInterval(()=>{
    const t=$('#timer');if(!t)return;
    const s=Math.floor((Date.now()-S.t0)/1000);
    t.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
  },1000);
}

/* ================= VOCABULARY ================= */
const VK='hsk-vocab-v2';
let VP={prog:{},custom:[]};
try{const r=localStorage.getItem(VK);if(r)VP=Object.assign({prog:{},custom:[]},JSON.parse(r));}catch(e){}
const vsave=()=>{try{localStorage.setItem(VK,JSON.stringify(VP));}catch(e){}};
function parseEx(s){return (s||'').split(';').map(x=>x.trim()).filter(Boolean).map(x=>{const i=x.indexOf('=');return i<0?[x,'']:[x.slice(0,i).trim(),x.slice(i+1).trim()];});}
const GROUPS=[],BUILTIN=[];
VOCAB_RAW.split('\n').forEach(line=>{
  line=line.trim();if(!line)return;
  if(line[0]==='#'){GROUPS.push(line.slice(1).trim());return;}
  const [w,p,en,ez,ee,ex]=line.split('|');
  BUILTIN.push({w,p,en,ez,ee,ex:parseEx(ex),g:GROUPS.length-1});
});
const allWords=()=>BUILTIN.concat(VP.custom.map(c=>Object.assign({},c,{g:-1,custom:true})));
const pg=w=>Object.assign({box:0,flag:false,seen:0},VP.prog[w]);
function setp(w,patch){VP.prog[w]=Object.assign(pg(w),patch);vsave();}
function status(w){const p=pg(w);if(p.flag)return ['不熟','bad'];if(p.box>=3)return ['已掌握','ok'];if(p.seen)return ['学习中','mid'];return ['未学','new'];}
function toggleFlag(w){const p=pg(w);if(p.flag)setp(w,{flag:false,box:Math.max(p.box,3),seen:p.seen+1});else setp(w,{flag:true,box:0});}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hl(text,word){
  const parts=word.replace(/（.*?）/g,'').split(/[…+\s]+/).map(s=>s.trim()).filter(s=>s&&!/^(N|adj|动词|名词|形容词)$/.test(s));
  const t=esc(text);
  if(!parts.length)return t;
  const re=new RegExp('('+parts.sort((a,b)=>b.length-a.length).map(s=>esc(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','g');
  return t.replace(re,'<mark>$1</mark>');
}
function speakWord(text){
  if(!TTS)return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text.replace(/[…+（）()]/g,' '));
  u.lang='zh-CN';const v=zhVoice();if(v)u.voice=v;u.rate=0.8;speechSynthesis.speak(u);
}
const plain=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();

const VW={tab:'list',q:'',g:'all',f:'all',open:new Set(),adding:false,edit:null};
const VC={active:false,done:false,deck:[],i:0,flip:false,got:0,miss:[],deckSel:'',size:'20',dir:'zh'};

function statText(){
  const a=allWords();
  const bad=a.filter(x=>status(x.w)[1]==='bad').length,ok=a.filter(x=>status(x.w)[1]==='ok').length;
  return '共 '+a.length+' 个词，不熟 '+bad+' 个，已掌握 '+ok+' 个';
}
function refreshStats(){const e=$('#vstats');if(e)e.textContent=statText();}

function showVocab(tab){
  if(tab)VW.tab=tab;
  clearInterval(S.tm);if(TTS)speechSynthesis.cancel();
  const tb=(id,label)=>h('button',{type:'button',role:'tab','aria-selected':String(VW.tab===id),onclick:()=>{VW.tab=id;showVocab();}},label);
  app.replaceChildren(h('div',{class:'vocab'},
    h('div',{class:'vtop'},
      h('span',{class:'seal'},'汉'),
      h('div',null,h('h1',null,'词库'),h('p',{class:'sub',id:'vstats'},statText())),
      h('div',{class:'vnav'},navButtons('vocab'))),
    h('div',{class:'tabs',role:'tablist'},tb('list','词库'),tb('cards','闪卡')),
    h('div',{id:'vbody'})));
  if(VW.tab==='cards')renderCards();else renderList();
  window.scrollTo({top:0});
}

/* ---------- word list ---------- */
function renderList(){
  const body=$('#vbody');body.replaceChildren();
  const gsel=h('select',{'aria-label':'分组'},
    h('option',{value:'all'},'全部分组'),
    GROUPS.map((g,i)=>h('option',{value:String(i)},g)),
    h('option',{value:'-1'},'我的生词'));
  gsel.value=VW.g;gsel.addEventListener('change',()=>{VW.g=gsel.value;fillList();});
  const fsel=h('select',{'aria-label':'状态'},

  fsel.value=VW.f;fsel.addEventListener('change',()=>{VW.f=fsel.value;fillList();});
  const q=h('input',{type:'search',placeholder:'搜索：汉字、拼音或英文',value:VW.q,'aria-label':'搜索'});

    h('div',{id:'vform'}),
    h('p',{class:'cnt',id:'vcount'}),
    h('div',{id:'vlist'}));

function fillList(){
  const q=plain(VW.q.trim());
  const list=allWords().filter(x=>{
    if(VW.g!=='all'&&String(x.g)!==VW.g)return false;
    if(VW.f!=='all'&&status(x.w)[1]!==VW.f)return false;
    if(q){
      const hay=plain([x.w,x.p,x.en,x.ez,x.ee,...x.ex.map(e=>e.join(' '))].join(' '));
      if(!hay.includes(q))return false;
    }
    return true;
  });
  $('#vcount').textContent='显示 '+list.length+' 个词';
  $('#vlist').replaceChildren(...list.map(rowEl));
}
function rowEl(x){
  const d=h('details',{class:'wrow'});
  d.open=VW.open.has(x.w);
  d.addEventListener('toggle',()=>{if(d.open)VW.open.add(x.w);else VW.open.delete(x.w);});
  const [stT,stC]=status(x.w);
  d.append(h('summary',null,h('span',{class:'wz'},x.w),h('span',{class:'wp'},x.p),h('span',{class:'wm'},x.en),h('span',{class:'chip2 '+stC},stT)));
  const body=h('div',{class:'wbody'});
  if(x.ez){
    const p=h('p',{class:'ex'});p.innerHTML=hl(x.ez,x.w);
    if(x.ee)p.append(h('small',null,x.ee));
    body.append(p);
  }
  if(x.ex&&x.ex.length){
    body.append(h('ul',{class:'exps'},x.ex.map(([a,b])=>{const li=h('li');li.innerHTML=hl(a,x.w);if(b)li.append(h('span',null,b));return li;})));
  }
  body.append(h('div',{class:'wact'},
    TTS?h('button',{type:'button',class:'btn',onclick:()=>speakWord(x.w)},'🔊 朗读'):null,
    h('button',{type:'button',class:'btn',onclick:()=>{toggleFlag(x.w);d.replaceWith(rowEl(x));refreshStats();}},pg(x.w).flag?'✓ 我已经熟悉了':'★ 标为不熟'),
    x.custom?h('button',{type:'button',class:'btn',onclick:()=>{VW.adding=true;VW.edit=x.w;renderForm();$('#vform').scrollIntoView({block:'center'});}},'编辑'):null,
    x.custom?h('button',{type:'button',class:'btn',onclick:()=>{VP.custom=VP.custom.filter(c=>c.w!==x.w);delete VP.prog[x.w];vsave();fillList();refreshStats();}},'删除'):null));
  d.append(body);

}

/* ---------- add / edit form ---------- */
function renderForm(){
  const box=$('#vform');if(!box)return;
  box.replaceChildren();
  if(!VW.adding)return;
  const cur=VW.edit?VP.custom.find(c=>c.w===VW.edit):null;
  const fld=(id,label,val,ph)=>h('label',null,label,h('input',{id,type:'text',value:val||'',placeholder:ph||'',lang:'zh-CN',autocomplete:'off'}));
  const ta=h('textarea',{id:'ftx',placeholder:'每行一条，例如：\n创造机会 = create opportunities'});
  ta.value=cur?cur.ex.map(e=>e[0]+(e[1]?' = '+e[1]:'')).join('\n'):'';
  const msg=h('p',{class:'vmsg',id:'fmsg','aria-live':'polite'});
  const form=h('div',{class:'vform'},
    h('div',{class:'two'},fld('fw','汉字 / 词语（必填）',cur&&cur.w),fld('fp','拼音',cur&&cur.p)),
    fld('fen','英文意思',cur&&cur.en),
    fld('fez','例句',cur&&cur.ez),
    fld('fee','例句翻译',cur&&cur.ee),
    h('label',null,'常用表达（每行一条：中文 = English）',ta),
    msg,
    h('div',{class:'wact'},
      h('button',{type:'button',class:'btn primary',onclick:saveWord},VW.edit?'保存修改':'添加到词库'),
      h('button',{type:'button',class:'btn',onclick:aiFill},'✨ 自动补全'),
      h('button',{type:'button',class:'btn',onclick:()=>{VW.adding=false;VW.edit=null;renderForm();}},'关闭')),
    h('p',{class:'cnt',style:'margin:0'},'只填汉字，直接点“添加到词库”：拼音、意思、例句和常用表达会自动生成（需要 Claude 连接）。新添加的词默认标为“不熟”。'));
  box.append(form);
}
function fmsg(t,err){const m=$('#fmsg');if(m){m.textContent=t;m.className='vmsg'+(err?' err':'');}}
async function saveWord(){
  const val=id=>$('#'+id).value.trim();
  const w=val('fw');
  if(!w){fmsg('请先输入汉字或词语。',true);return;}
  if(!VW.edit&&!val('fen')&&!val('fez'))await aiFill();
  const entry={w,p:val('fp'),en:val('fen'),ez:val('fez'),ee:val('fee'),ex:parseEx(val('ftx').split('\n').map(s=>s.trim()).filter(Boolean).join(';'))};
  if(VW.edit){
    const i=VP.custom.findIndex(c=>c.w===VW.edit);
    if(i>=0)VP.custom[i]=entry;
    if(VW.edit!==w&&VP.prog[VW.edit]){VP.prog[w]=VP.prog[VW.edit];delete VP.prog[VW.edit];}
    VW.edit=null;VW.adding=false;vsave();renderForm();fillList();refreshStats();return;
  }
  const exists=allWords().find(x=>x.w===w);
  if(exists){
    setp(w,{flag:true,box:0});
    fmsg('“'+w+'”已经在词库里了，已把它标为“不熟”。');
    fillList();refreshStats();return;
  }
  VP.custom.unshift(entry);
  setp(w,{flag:true,box:0});
  ['fw','fp','fen','fez','fee','ftx'].forEach(id=>{$('#'+id).value='';});
  fmsg('已添加“'+w+'”。可以继续添加下一个。');
  fillList();refreshStats();
}
async function aiFill(){
  const w=$('#fw').value.trim();
  if(!w){fmsg('请先输入汉字或词语。',true);return;}
  let s=null;
  try{if(window.claude&&claude.use)s=await claude.use('sample');}catch(e){}
  if(!s){fmsg('当前环境不能自动补全，请手动填写。',true);return;}
  fmsg('正在生成……');
  const prompt='你是汉语老师。请为学习者生成这个词语的词条：'+w+'。只返回一个JSON对象，不要代码块，不要其他文字。格式：{"p":"带声调符号的拼音","en":"简短英文释义","ez":"一个HSK4到5水平的中文例句，必须包含该词","ee":"例句的英文翻译","ex":[["常用搭配或表达","English"],["常用搭配或表达","English"],["常用搭配或表达","English"]]}';
  try{
    const r=await s.json(prompt);
    const set=(id,v)=>{const el=$('#'+id);if(el&&v&&!el.value.trim())el.value=v;};
    set('fp',r.p);set('fen',r.en);set('fez',r.ez);set('fee',r.ee);
    if(Array.isArray(r.ex))set('ftx',r.ex.map(e=>Array.isArray(e)?e[0]+(e[1]?' = '+e[1]:''):String(e)).join('\n'));
    fmsg('已补全，请检查后点“添加到词库”。');
  }catch(e){fmsg('自动补全失败：'+(e&&e.message?e.message:'请稍后再试')+'。你可以手动填写。',true);}
}

/* ---------- flashcards ---------- */
function deckOptions(){
  return [['bad','不熟的词'],['new','还没学过的词'],['all','全部词'],['custom','我的生词']].concat(GROUPS.map((g,i)=>['g'+i,g]));
}
function deckWords(sel){
  const a=allWords();
  if(sel==='all')return a;
  if(sel==='bad')return a.filter(x=>status(x.w)[1]==='bad');
  if(sel==='new')return a.filter(x=>status(x.w)[1]==='new');
  if(sel==='custom')return a.filter(x=>x.custom);
  return a.filter(x=>'g'+x.g===sel);
}
function renderCards(){
  const body=$('#vbody');body.replaceChildren();
  if(VC.active){body.append(cardView());return;}
  if(VC.done){body.append(doneView());return;}
  if(!VC.deckSel)VC.deckSel=deckWords('bad').length?'bad':'all';
  const sel=(id,opts,val,fn)=>{const s=h('select',{id},opts.map(([v,t])=>h('option',{value:v},t)));s.value=val;s.addEventListener('change',()=>fn(s.value));return s;};
  const info=h('p',{class:'cnt',style:'margin:0'});
  const upd=()=>{info.textContent='这一组有 '+deckWords(VC.deckSel).length+' 个词。';};
  upd();
  body.append(h('div',{class:'setup'},
    h('label',null,'选择词组',sel('dsel',deckOptions(),VC.deckSel,v=>{VC.deckSel=v;upd();})),
    h('label',null,'每轮数量',sel('ssel',[['10','10 个'],['20','20 个'],['50','50 个'],['all','全部']],VC.size,v=>{VC.size=v;})),
    h('label',null,'卡片方向',sel('rsel',[['zh','看汉字，想意思'],['en','看英文，想汉字']],VC.dir,v=>{VC.dir=v;})),
    info,
    h('p',{id:'smsg',class:'vmsg err'}),
    h('button',{type:'button',class:'btn primary',onclick:startDeck},'开始'),
    h('p',{class:'cnt',style:'margin:0'},'点击卡片翻面（空格键）。选“不熟”会把词放进不熟列表，之后优先复习；连续记住几次后，词会变成“已掌握”。')));
}
function startDeck(){
  let ws=deckWords(VC.deckSel);
  if(!ws.length){$('#smsg').textContent='这一组没有词。请换一组，或先在词库里标记不熟的词。';return;}
  shuffle(ws=ws.slice());
  ws.sort((a,b)=>pg(a.w).box-pg(b.w).box);
  if(VC.size!=='all')ws=ws.slice(0,+VC.size);
  Object.assign(VC,{active:true,done:false,deck:ws,i:0,flip:false,got:0,miss:[]});
  renderCards();
}
function cardView(){
  const x=VC.deck[VC.i],n=VC.deck.length;
  const front=VC.dir==='zh'
    ?[h('div',{class:'big'},x.w),h('div',{class:'tap'},'点击翻面（空格键）')]
    :[h('div',{class:'big en'},x.en),h('div',{class:'tap'},'想一想中文怎么说，然后点击翻面')];
  let back=[];
  if(VC.flip){
    const bk=h('div',{class:'bk'});
    if(x.ez){const p=h('p');p.innerHTML=hl(x.ez,x.w);if(x.ee)p.append(h('small',null,x.ee));bk.append(p);}
    if(x.ex&&x.ex.length)bk.append(h('ul',null,x.ex.map(([a,b])=>{const li=h('li');li.innerHTML=hl(a,x.w);if(b)li.append(h('span',null,b));return li;})));
    back=[h('div',{class:'pin'},x.p||''),h('div',{class:'big',style:'margin:6px 0'},x.w),h('div',{class:'mean'},x.en||''),bk];
  }
  const card=h('div',{class:'fcard',id:'fcard',role:'button',tabindex:'0','aria-label':'翻面',onclick:()=>{VC.flip=!VC.flip;renderCards();}},VC.flip?back:front);
  const wrap=h('div',{class:'fc-wrap'},
    h('div',{class:'fc-top'},h('span',null,(VC.i+1)+' / '+n),h('span',null,status(x.w)[0])),
    h('div',{class:'fc-bar'},h('i',{style:'width:'+(VC.i/n*100)+'%'})),
    card);
  if(VC.flip){
    wrap.append(h('div',{class:'fc-act'},
      h('button',{type:'button',class:'btn no',onclick:()=>answerCard(false)},'← 不熟'),
      h('button',{type:'button',class:'btn yes',onclick:()=>answerCard(true)},'记住了 →')));
  }else{
    wrap.append(h('div',{class:'fc-act',style:'grid-template-columns:1fr'},h('button',{type:'button',class:'btn primary',onclick:()=>{VC.flip=true;renderCards();}},'翻面')));
  }
  wrap.append(h('div',{class:'fc-side'},
    TTS?h('button',{type:'button',class:'btn',onclick:()=>speakWord(x.w)},'🔊 朗读'):null,
    h('button',{type:'button',class:'btn',onclick:()=>{VC.active=false;VC.done=false;renderCards();}},'结束本轮')));
  return wrap;
}
function answerCard(got){
  const x=VC.deck[VC.i],p=pg(x.w);
  if(got){const box=Math.min(4,p.box+1);setp(x.w,{box,seen:p.seen+1,flag:box>=3?false:p.flag});VC.got++;}
  else{setp(x.w,{box:0,flag:true,seen:p.seen+1});VC.miss.push(x);}
  VC.i++;VC.flip=false;
  if(VC.i>=VC.deck.length){VC.active=false;VC.done=true;}
  refreshStats();renderCards();
}
function doneView(){
  const n=VC.deck.length;
  return h('div',{class:'fc-wrap'},
    h('div',{class:'result'},
      h('div',{class:'score'},String(VC.got),h('small',null,' / '+n+' 记住了')),
      h('p',{class:'verdict'},VC.miss.length?'下面这些词还不熟，已经放进“不熟”列表。':'这一轮全部记住了！'),
      VC.miss.map(x=>h('div',{class:'rrow',style:'grid-template-columns:130px 1fr'},h('span',{class:'nm'},x.w),h('span',null,x.p+'　'+x.en))),
      h('div',{class:'tools'},
        VC.miss.length?h('button',{type:'button',class:'btn primary',onclick:()=>{const ws=shuffle(VC.miss.slice());Object.assign(VC,{active:true,done:false,deck:ws,i:0,flip:false,got:0,miss:[]});renderCards();}},'重练不熟的'):null,
        h('button',{type:'button',class:'btn',onclick:()=>{VC.done=false;renderCards();}},'再来一组'),
        h('button',{type:'button',class:'btn',onclick:()=>showVocab('list')},'查看词库'))));
}
document.addEventListener('keydown',e=>{
  if(!VC.active||VW.tab!=='cards'||!$('#fcard'))return;
  const tag=document.activeElement&&document.activeElement.tagName;
  if(/INPUT|TEXTAREA|SELECT|BUTTON/.test(tag))return;
  if(e.key===' '||e.key==='Enter'){e.preventDefault();VC.flip=!VC.flip;renderCards();}
  else if(e.key==='ArrowLeft'&&VC.flip){e.preventDefault();answerCard(false);}
  else if(e.key==='ArrowRight'){e.preventDefault();if(VC.flip)answerCard(true);else{VC.flip=true;renderCards();}}
});

完全|wánquán|completely|我完全同意你的看法。|I completely agree with your view.|完全不同=totally different;完全明白=understand completely

吸收|xīshōu|to absorb|植物从土地里吸收水分和养分。|Plants absorb water and nutrients from the soil.|吸收知识=absorb knowledge;吸收营养=absorb nutrition

效果|xiàoguǒ|effect, result|这种药的效果很明显。|The effect of this medicine is obvious.|效果很好=works well;达到效果=achieve the effect
信任|xìnrèn|to trust; trust|朋友之间最重要的是互相信任。|The most important thing between friends is mutual trust.|互相信任=trust each other;赢得信任=win trust

勇气|yǒngqì|courage|她终于鼓起勇气说出了心里话。|She finally plucked up the courage to speak her mind.|鼓起勇气=muster courage;缺乏勇气=lack courage
优势|yōushì|advantage|这家公司的优势是价格低。|This company's advantage is low prices.|发挥优势=play to one's strengths;竞争优势=competitive advantage
有利|yǒulì|beneficial|多运动对身体健康有利。|Exercising more is good for one's health.|有利条件=favorable conditions;对……有利=beneficial to …
预防|yùfáng|to prevent|每天锻炼可以预防很多疾病。|Exercising daily can prevent many illnesses.|预防疾病=prevent disease;预防为主=prevention first
增加|zēngjiā|to increase|这个月的订单增加了百分之二十。|This month's orders increased by twenty percent.|增加收入=increase income;逐渐增加=gradually increase
珍惜|zhēnxī|to cherish|我们应该珍惜现在的生活。|We should cherish our current life.|珍惜时间=cherish time;珍惜机会=cherish opportunities
争论|zhēnglùn|to argue, debate|他们为这个问题争论了很久。|They argued over this issue for a long time.|激烈争论=heated debate;引起争论=spark debate
支持|zhīchí|to support|谢谢你们一直以来的支持。|Thank you for your support all along.|支持者=supporter;表示支持=express support
指导|zhǐdǎo|to guide; guidance|在老师的指导下，他完成了论文。|Under the teacher's guidance, he finished his thesis.|指导老师=supervisor;在……指导下=under the guidance of …
至少|zhìshǎo|at least|这本书至少要三天才能看完。|This book takes at least three days to finish.|至少三个=at least three;至少还有=at least there's still
周围|zhōuwéi|surroundings|我家周围有很多商店。|There are many shops around my home.|周围环境=surroundings;周围的人=people around
主动|zhǔdòng|proactive; on one's own initiative|他总是主动帮助同事。|He always takes the initiative to help colleagues.|主动联系=take the initiative to contact;积极主动=proactive
专业|zhuānyè|major; professional|她大学学的是法律专业。|She majored in law at university.|专业知识=professional knowledge;专业人士=professional
转告|zhuǎngào|to pass on (a message)|请你转告他，会议改到下午三点。|Please tell him the meeting has moved to 3 p.m.|转告他=pass it on to him;代为转告=pass on on one's behalf
状态|zhuàngtài|state, condition|最近他的状态很好，工作也很顺利。|Lately he's in great form and his work is going well.|良好的状态=good condition;精神状态=mental state
自信|zìxìn|confident; confidence|她对自己的汉语水平很自信。|She is very confident about her Chinese level.|充满自信=full of confidence;自信心=self-confidence
总是|zǒngshì|always|他总是第一个来到办公室。|He is always the first to arrive at the office.|总是迟到=always late;不总是=not always
尊敬|zūnjìng|to respect|学生们都很尊敬这位老教授。|The students all respect this old professor.|受人尊敬=be respected;尊敬老人=respect the elderly
作用|zuòyòng|effect, role|运动对减轻压力有很大的作用。|Exercise plays a big role in relieving stress.|起作用=take effect;发挥作用=play a role
缓解|huǎnjiě|to relieve, ease|听音乐可以缓解紧张的情绪。|Listening to music can relieve nervous feelings.|缓解压力=relieve stress;缓解疲劳=relieve fatigue
机会|jīhuì|chance, opportunity|这是一个难得的好机会。|This is a rare good opportunity.|抓住机会=seize the chance;错过机会=miss a chance
压力|yālì|pressure|最近工作压力很大，我晚上睡不着。|Work pressure has been heavy lately, and I can't sleep at night.|压力很大=under great pressure;减轻压力=reduce pressure
习惯|xíguàn|habit; to be used to|早睡早起是个好习惯。|Going to bed and rising early is a good habit.|养成习惯=form a habit;改掉习惯=break a habit
挑战|tiǎozhàn|challenge|这份工作对我来说是一个新的挑战。|This job is a new challenge for me.|接受挑战=accept a challenge;面对挑战=face a challenge
假如|jiǎrú|if, supposing|假如你是我，你会怎么做？|If you were me, what would you do?|假如没有=if there were no …;假如有机会=if there is a chance
难免|nánmiǎn|hard to avoid|刚开始学汉语，难免会犯错误。|When you've just started learning Chinese, mistakes are hard to avoid.|在所难免=unavoidable;难免出错=bound to err
逐渐|zhújiàn|gradually|天气逐渐变冷了。|The weather is gradually getting colder.|逐渐增加=gradually increase;逐渐适应=gradually adapt`;

/* Grammar curriculum. 【 】 marks the key words of the structure. lvl: 4 = HSK 4 range, 5 = HSK 5 range (approximate).
   f = family (used to choose sensible wrong options in quizzes). */
const GRAM=[
{p:'虽然……但是……',lvl:4,f:'con',m:'although … but …',n:'Chinese uses BOTH words together (English uses only one). 但是 can be replaced by 可是 / 不过 / 却.',ex:[['【虽然】这家餐厅很小，【但是】菜很好吃。','Although this restaurant is small, the food is delicious.'],['【虽然】他年纪不大，【但是】懂得很多。','Although he is young, he knows a lot.']]},
{p:'不但……而且……',lvl:4,f:'add',m:'not only … but also …',n:'The second part usually has 也 / 还 / 都. If the two parts have different subjects, put 不但 before the first subject.',ex:[['他【不但】会说英语，【而且】会说日语。','He can speak not only English but also Japanese.'],['这家饭馆【不但】便宜，【而且】很干净。','This restaurant is not only cheap but also clean.']]},
{p:'如果……就……',lvl:4,f:'cond',m:'if … then …',n:'要是 / 假如 are more spoken or more formal alternatives. 就 comes before the verb in the result clause.',ex:[['【如果】明天不下雨，我们【就】去公园。','If it doesn\'t rain tomorrow, we\'ll go to the park.'],['【要是】你有问题，【就】给我打电话。','If you have a problem, just call me.']]},
{p:'只要……就……',lvl:4,f:'cond',m:'as long as … then …',n:'Gives a sufficient condition (the condition is enough). Compare with 只有……才……, which gives the only condition.',ex:[['【只要】你努力，【就】一定能成功。','As long as you work hard, you will surely succeed.'],['【只要】多听多说，【就】能提高口语。','As long as you listen and speak a lot, you can improve your speaking.']]},
{p:'只有……才……',lvl:4,f:'cond',m:'only if … then (and only then) …',n:'Gives the ONLY condition. 才 suggests "only then / not until".',ex:[['【只有】坚持锻炼，身体【才】会健康。','Only by exercising regularly will your body be healthy.'],['【只有】亲自去看看，你【才】会明白。','Only if you go and see for yourself will you understand.']]},
{p:'一边……一边……',lvl:4,f:'add',m:'doing two things at the same time',n:'Both actions are done by the same subject at the same time. Each 一边 goes before a verb.',ex:[['他【一边】走路，【一边】听音乐。','He listens to music while walking.'],['妈妈【一边】做饭，【一边】看电视。','Mom watches TV while cooking.']]},
{p:'越……越……',lvl:4,f:'add',m:'the more … the more …',n:'Both parts can have the same subject or different subjects. Adjectives and verbs both work.',ex:[['雨【越】下【越】大。','The rain falls harder and harder.'],['汉语【越】学【越】有意思。','The more you study Chinese, the more interesting it gets.']]},
{p:'一……就……',lvl:4,f:'add',m:'as soon as … (then) …',n:'Two actions follow each other immediately, or one situation always leads to another.',ex:[['他【一】回家【就】打开电视。','As soon as he gets home he turns on the TV.'],['我【一】看见他【就】想笑。','I want to laugh the moment I see him.']]},
{p:'除了……(以外)，还/都……',lvl:4,f:'add',m:'besides … also … / except … all …',n:'除了……还…… ADDS something. 除了……都…… EXCLUDES something (everyone except …).',ex:[['【除了】汉语，他【还】会说法语。','Besides Chinese, he can also speak French.'],['【除了】小王，大家【都】到了。','Everyone has arrived except Xiao Wang.']]},
{p:'把字句',lvl:4,f:'struct',m:'把 sentence: Subject + 把 + Object + Verb + other element',n:'Use it when you do something TO a definite object and say what happens to it. The verb cannot stand alone: add a complement, 了, or a place.',ex:[['请【把】门关上。','Please close the door.'],['我【把】作业交给老师了。','I handed my homework in to the teacher.'],['他【把】那本书放在桌子上。','He put that book on the table.']]},
{p:'被字句',lvl:4,f:'struct',m:'passive: Receiver + 被 + (Agent) + Verb + other element',n:'Often describes something unpleasant or unexpected. The agent after 被 can be dropped; in speech 让 / 叫 can replace 被 (agent required).',ex:[['我的手机【被】弟弟弄坏了。','My phone was broken by my younger brother.'],['那个杯子【被】打碎了。','That cup was smashed.']]},
{p:'A 比 B + 形容词',lvl:4,f:'struct',m:'comparison with 比',n:'Do NOT put 很 / 非常 before the adjective. Add 更 / 还 for "even more", or 一点儿 / 得多 / 多了 for the size of the difference.',ex:[['今天【比】昨天冷得多。','Today is much colder than yesterday.'],['他【比】我高一点儿。','He is a little taller than me.'],['这件【比】那件更贵。','This one is even more expensive than that one.']]},
{p:'动词 + 得 + 补语',lvl:4,f:'struct',m:'degree complement: how well / how much something is done',n:'If the verb has an object, repeat the verb: 她唱歌唱得很好听. The negative goes in the complement: 跑得不快.',ex:[['她唱歌唱【得】很好听。','She sings very beautifully.'],['他跑【得】比我快。','He runs faster than I do.']]},
{p:'对……来说',lvl:4,f:'struct',m:'for …, as far as … is concerned',n:'Gives the point of view of a person or group. Also: 对……感兴趣 (be interested in …), 对……有好处 (be good for …).',ex:[['【对】学生【来说】，时间很宝贵。','For students, time is precious.'],['【对】我【来说】，家人最重要。','For me, family is the most important.']]},
{p:'为了……',lvl:4,f:'cause',m:'in order to …, for the sake of …',n:'Introduces a purpose, usually at the start of the sentence. Do not confuse with 因为 (because; a reason).',ex:[['【为了】提高成绩，他每天学习到很晚。','In order to improve his grades, he studies late every day.'],['【为了】健康，我不再抽烟了。','For the sake of my health, I quit smoking.']]},
{p:'是……的',lvl:4,f:'struct',m:'emphasizing time, place, or manner of a past action',n:'Used when the action has already happened and you want to stress HOW / WHEN / WHERE / WHO. 是 can often be dropped in affirmative sentences.',ex:[['他【是】昨天到北京【的】。','It was yesterday that he arrived in Beijing.'],['这本书【是】在网上买【的】。','This book was bought online.']]},
{p:'既然……就……',lvl:4,f:'cause',m:'since … then …',n:'The first part is a fact that is already known or accepted; the second part is a suggestion or conclusion based on it.',ex:[['【既然】你不舒服，【就】早点回家休息吧。','Since you don\'t feel well, go home and rest early.'],['【既然】大家都同意，我们【就】这样决定吧。','Since everyone agrees, let\'s decide it this way.']]},
{p:'即使……也……',lvl:4,f:'con',m:'even if … still …',n:'The first part is a hypothetical (or unlikely) situation; the second part says the result does not change. 就算 / 哪怕 are similar.',ex:[['【即使】明天下雨，我【也】要去爬山。','Even if it rains tomorrow, I\'ll still go hiking.'],['【即使】很累，他【也】不肯休息。','Even though he is tired, he refuses to rest.']]},
{p:'并（不/没）',lvl:4,f:'struct',m:'(not) at all, actually not — to deny an assumption',n:'并 goes before a negative (不 / 没 / 非) to strengthen it, often to correct what someone expected or said.',ex:[['我【并】不累，你不用担心。','I\'m actually not tired; you needn\'t worry.'],['事情【并】没有你想的那么简单。','Things are not as simple as you think.']]},
{p:'连……都/也……',lvl:4,f:'struct',m:'even … (also …)',n:'连 + extreme example + 都 / 也: if even the extreme case is like this, the rest certainly is.',ex:[['他忙得【连】饭【都】忘了吃。','He was so busy that he even forgot to eat.'],['这个问题【连】小孩子【都】知道。','Even a small child knows this.']]},
{p:'既……又……',lvl:4,f:'add',m:'both … and … (two qualities at once)',n:'Joins two adjectives or verbs describing the same subject. 又……又…… is the spoken version.',ex:[['这件衣服【既】漂亮【又】便宜。','This piece of clothing is both pretty and cheap.'],['她【既】聪明【又】努力。','She is both smart and hardworking.']]},
{p:'不是……而是……',lvl:4,f:'add',m:'not … but rather …',n:'Corrects a wrong idea: denies the first part and gives the true one.',ex:[['他【不是】不想去，【而是】没有时间。','It\'s not that he doesn\'t want to go, but that he has no time.'],['问题【不是】钱，【而是】时间。','The problem is not money but time.']]},
{p:'无论/不管……都……',lvl:5,f:'con',m:'no matter … always …',n:'Needs a question word (谁 / 什么 / 怎么 / 多) or a choice (A 还是 B) in the first part. The result is the same in every case.',ex:[['【无论】天气怎么样，他【都】会来。','No matter what the weather is like, he will come.'],['【不管】多忙，我【都】会锻炼。','However busy I am, I will exercise.']]},
{p:'尽管……但是/还是……',lvl:5,f:'con',m:'although / in spite of … still …',n:'Like 虽然 but more formal and emphasizes that the fact does not stop the result. 尽管 can also start a sentence on its own: 尽管如此 (even so).',ex:[['【尽管】很累，他【还是】坚持完成了工作。','Although he was tired, he still insisted on finishing the work.'],['【尽管】价格很高，顾客【还是】很多。','Even though the price is high, there are still many customers.']]},
{p:'由于……所以/因此……',lvl:5,f:'cause',m:'owing to … therefore …',n:'More formal than 因为. Often used in writing. 由于 can stand alone with the result clause using 因此 / 所以.',ex:[['【由于】天气不好，航班取消了。','Due to the bad weather, the flight was cancelled.'],['【由于】堵车，他迟到了。','He was late because of the traffic jam.']]},
{p:'与其……不如……',lvl:5,f:'choice',m:'rather than … better to …',n:'The speaker prefers the SECOND option. The first option is what you reject.',ex:[['【与其】在家看电视，【不如】出去走走。','Rather than watching TV at home, it\'s better to go for a walk.'],['【与其】抱怨，【不如】想办法解决问题。','Instead of complaining, you had better find a way to solve it.']]},
{p:'宁可……也不……',lvl:5,f:'choice',m:'would rather … than …',n:'The speaker chooses the FIRST option (the lesser evil) and rejects the second. Compare with 与其……不如…… (prefers the second).',ex:[['我【宁可】走路去，【也】不想坐那么挤的车。','I would rather walk than ride such a crowded bus.'],['他【宁可】不睡觉，【也】要把工作做完。','He would rather skip sleep than leave the work unfinished.']]},
{p:'除非……才……',lvl:5,f:'cond',m:'only if / unless … (then) …',n:'Names the only condition that can lead to the result. 除非……否则…… means "unless … otherwise …".',ex:[['【除非】你亲自去，他们【才】会答应。','Only if you go in person will they agree.'],['【除非】下雨，【否则】我们明天就出发。','Unless it rains, we will set off tomorrow.']]},
{p:'难道……吗？',lvl:5,f:'struct',m:'rhetorical question: "Don\'t tell me that …?"',n:'Expresses surprise, doubt or reproach. The answer is usually obvious. 难道 goes before the verb phrase; 吗 is at the end.',ex:[['【难道】你不知道今天考试吗？','Don\'t you know there\'s an exam today?'],['这么简单的事，【难道】你还不会做吗？','Such a simple thing, and you still can\'t do it?']]},
{p:'到底/究竟',lvl:5,f:'struct',m:'(what) on earth …, in the end …',n:'Added to a question to press for a real answer. 究竟 is a bit more formal. Also 到底 can mean "after all / in the end" in statements.',ex:[['你【到底】想去哪儿？','Where on earth do you want to go?'],['这【究竟】是怎么回事？','What exactly is going on here?']]},
{p:'竟然/居然',lvl:5,f:'struct',m:'unexpectedly, to one\'s surprise',n:'Placed before the verb or adjective. Shows the speaker did not expect it. 没想到…… is similar.',ex:[['他【竟然】忘了自己的生日。','He actually forgot his own birthday.'],['没想到他【居然】一个人完成了。','I never expected he would finish it all by himself.']]},
{p:'幸亏……否则……',lvl:5,f:'cause',m:'luckily … otherwise …',n:'幸亏 introduces the lucky circumstance; 否则 / 不然 shows the bad result that would have followed.',ex:[['【幸亏】带了伞，【否则】就被淋湿了。','Luckily I brought an umbrella; otherwise I would have got soaked.'],['【幸亏】你提醒了我，【不然】我就忘了。','Luckily you reminded me, or else I\'d have forgotten.']]},
{p:'一旦……就……',lvl:5,f:'cond',m:'once … then …',n:'Stresses that after something happens (often unwelcome), a result follows. Often has a serious tone.',ex:[['【一旦】决定了，【就】不要后悔。','Once you have decided, don\'t regret it.'],['【一旦】发现问题，【就】要马上解决。','Once a problem is discovered, it must be solved at once.']]},
{p:'凡是……都……',lvl:5,f:'cond',m:'every … without exception …',n:'凡是 + a group, followed by 都 in the second part.',ex:[['【凡是】参加会议的人，【都】要签名。','Everyone attending the meeting must sign in.'],['【凡是】他说的话，我【都】相信。','Whatever he says, I believe.']]},
{p:'至于',lvl:5,f:'struct',m:'as for …, as to …',n:'Shifts to a new topic related to what was just said.',ex:[['我只知道这些，【至于】其他的，你问他吧。','This is all I know; as for the rest, ask him.'],['我负责设计，【至于】价格，由经理决定。','I\'m in charge of the design; as for the price, the manager decides.']]},
{p:'关于 / 对于',lvl:5,f:'struct',m:'about / regarding; as for / with regard to',n:'关于 introduces a topic (about); 对于 introduces the object of an attitude or action (towards). Both phrases usually go before the subject.',ex:[['【关于】这个问题，我们明天再讨论。','Regarding this question, we\'ll discuss it tomorrow.'],['【对于】这件事，大家的看法不一样。','With regard to this matter, everyone sees it differently.']]},
{p:'随着……',lvl:5,f:'struct',m:'along with …, as … changes',n:'Introduces a change that brings other changes. The main clause often has 越来越 or 逐渐.',ex:[['【随着】经济的发展，人们的生活越来越好。','With economic development, people\'s lives keep getting better.'],['【随着】科技的进步，手机的功能越来越多。','As technology advances, phones have more and more functions.']]},
{p:'以……为……',lvl:5,f:'struct',m:'take … as …, regard … as …',n:'A formal pattern. Common: 以……为主 (centered on …), 以……为目标 (take … as the goal), 以……为榜样 (model oneself on …).',ex:[['他【以】老师【为】榜样，认真学习。','He takes his teacher as a role model and studies seriously.'],['这家公司【以】创新【为】主要目标。','This company takes innovation as its main goal.']]},
{p:'之所以……是因为……',lvl:5,f:'cause',m:'the reason why … is that …',n:'Puts the RESULT first and the REASON second (the reverse of 因为……所以……).',ex:[['他【之所以】迟到，【是因为】堵车了。','The reason he was late is that there was a traffic jam.'],['我【之所以】选择这个专业，【是因为】我对它很感兴趣。','The reason I chose this major is that I\'m very interested in it.']]},
{p:'趁（着）……',lvl:5,f:'struct',m:'take advantage of (a time or chance) while …',n:'趁 + a favorable time / condition, then the action you should do now.',ex:[['【趁】天还没黑，我们赶快出发吧。','Let\'s set off quickly while it\'s still light.'],['【趁】年轻，多学点东西。','Learn more while you\'re young.']]},
{p:'通过……',lvl:5,f:'struct',m:'through, by means of; by way of',n:'Introduces the method or channel by which something is achieved.',ex:[['【通过】努力，他取得了好成绩。','Through hard work, he achieved good results.'],['我们【通过】网络了解了这个消息。','We learned this news through the internet.']]},
{p:'把……当作……',lvl:5,f:'struct',m:'regard … as …, treat … as …',n:'A 把-sentence with a fixed complement: 当作 / 看成 / 看作.',ex:[['他【把】我【当作】最好的朋友。','He regards me as his best friend.'],['不要【把】这件事【看成】小事。','Don\'t regard this as a small matter.']]},
{p:'在……看来',lvl:5,f:'struct',m:'in someone\'s view / opinion',n:'Put a person or group between 在 and 看来. Used to give an opinion.',ex:[['【在】我【看来】，这个办法不太合适。','In my view, this method isn\'t very suitable.'],['【在】专家【看来】，这个趋势还会继续。','In the experts\' view, this trend will continue.']]},
{p:'从……来看',lvl:5,f:'struct',m:'judging from …, from the standpoint of …',n:'Gives the basis or angle for a judgement. 从……角度来看 is very common.',ex:[['【从】长远【来看】，这个投资是值得的。','In the long run, this investment is worthwhile.'],['【从】数据【来看】，销量比去年增加了。','Judging from the data, sales rose compared with last year.']]},
{p:'一方面……另一方面……',lvl:5,f:'add',m:'on the one hand … on the other hand …',n:'Presents two aspects of one matter. The two sides can complement or contrast each other.',ex:[['【一方面】要认真工作，【另一方面】也要注意休息。','On the one hand you must work seriously; on the other, you must also rest.'],['【一方面】价格便宜，【另一方面】质量也不错。','On the one hand the price is low; on the other the quality is also good.']]}
];

/* ================= TEST GENERATOR (new test from the glossary every time) ================= */
const isPat=w=>/[…+]/.test(w);
function keyParts(w){return w.replace(/（.*?）/g,'').split(/[…+\s]+/).map(s=>s.trim()).filter(s=>s&&!/^(N|adj|动词|名词|形容词|结果)$/.test(s));}
function sample(a,n){return shuffle(a.slice()).slice(0,n);}
function uniq(a){return [...new Set(a)];}
function mc(correct,wrong){const o=shuffle([correct].concat(uniq(wrong).filter(x=>x!==correct)));return {options:o,answer:o.indexOf(correct)};}
function weightedOrder(words){
  const wt=x=>{const s=status(x.w)[1];return s==='bad'?4:s==='mid'?3:s==='new'?2:1;};
  return words.map(x=>({x,k:-Math.log(Math.random()||1e-9)/wt(x)})).sort((a,b)=>a.k-b.k).map(o=>o.x);
}
function clozeText(ez,w){
  const i=ez.indexOf(w);if(i<0||ez.indexOf(w,i+1)>=0)return null;
  return ez.slice(0,i)+'（　　）'+ez.slice(i+w.length);
}
function related(a,b){return a===b||a.includes(b)||b.includes(a);}
function chunkSentence(ez,w){
  const s=ez.replace(/[。！？!?.]+$/,'');
  let cl=s.split(/[，,、；;]/).map(x=>x.trim()).filter(Boolean);
  if(cl.length<3){
    let k=cl.findIndex(c=>c.includes(w));
    if(k<0)return null;
    const c=cl[k],i=c.indexOf(w);
    const pre=c.slice(0,i),post=c.slice(i+w.length);
    const mid=[pre,w,post].filter(Boolean);
    cl=cl.slice(0,k).concat(mid,cl.slice(k+1));
  }
  if(cl.length<3||cl.length>6)return null;
  if(new Set(cl).size!==cl.length)return null;
  return cl;
}
function shuffledFrags(ch){
  let idx;
  do{idx=shuffle(ch.map((_,i)=>i));}while(idx.every((v,i)=>v===i));
  return {frags:idx.map(i=>ch[i]),idx};
}

const TSK='hsk-testsrc';let TS={src:'mine',lv:[4,5]};
try{const o=JSON.parse(localStorage.getItem(TSK));if(o&&o.src&&Array.isArray(o.lv))TS=o;}catch(e){}
function testWords(){
  const mine=allWords();
  if(TS.src==='mine')return mine;
  const seen=new Set(TS.src==='both'?mine.map(x=>x.w):[]),hw=[];
  TS.lv.forEach(n=>(window.__hskWords?window.__hskWords(n):[]).forEach(x=>{
    if(seen.has(x.h))return;seen.add(x.h);
    hw.push({w:x.h,p:x.p,en:x.e||x.r,ez:'',ee:'',ex:[],hsk:n});}));
  const all=TS.src==='both'?mine.concat(hw):hw;
  return all.length>=12?all:mine;
}
function setTS(){try{localStorage.setItem(TSK,JSON.stringify(TS));}catch(e){}CURT=buildTest();showHome();}
function srcPanel(){
  const chip=(t,on,fn)=>h('button',{type:'button',class:'btn'+(on?' primary':''),onclick:fn},t);
  return h('div',{class:'srcp'},h('b',null,'题库来源 / Test words:'),
    chip('我的词库 / My list',TS.src==='mine',()=>{TS.src='mine';setTS();}),
    chip('HSK 词表 / HSK',TS.src==='hsk',()=>{TS.src='hsk';setTS();}),
    chip('两者 / Both',TS.src==='both',()=>{TS.src='both';setTS();}),
    h('span',null,'HSK 级别 / level:'),
    [1,2,3,4,5].map(n=>chip('HSK '+n,TS.src!=='mine'&&TS.lv.includes(n),()=>{
      if(TS.src==='mine'){TS.src='hsk';TS.lv=[n];}
      else{TS.lv=TS.lv.includes(n)?TS.lv.filter(m=>m!==n):TS.lv.concat(n).sort();if(!TS.lv.length)TS.lv=[n];}
      setTS();})),
    h('span',{class:'cnt'},'点一个级别即可生成该级别的模拟考试；可多选。 Tap a level for a mock test of that level (multi-select).'));
}
function buildTest(){
  const W=testWords();
  const ord=weightedOrder(W),used=new Set();
  const pickQ=(build,n)=>{
    const out=[];
    for(const x of ord){
      if(out.length>=n)break;
      if(used.has(x.w))continue;
      const q=build(x);if(!q)continue;
      used.add(x.w);out.push(q);
    }
    return out;
  };
  const hasS=x=>x.ez&&x.ee;
  const others=(x,pred,n,fn)=>sample(W.filter(y=>y.w!==x.w&&pred(y)),n*3).map(fn).filter(Boolean);

  /* ---- grammar part 1: connectors / patterns (cloze with choices) ---- */
  const MULTI_EXTRA=['因为……所以……','不但……而且……','如果……就……','只有……才……','虽然……但是……','只要……就……','一边……一边……','越……越……','无论……都……','除了……还……'];
  const g6=W.filter(y=>y.g===6&&!/[+]/.test(y.w));
  const connB=x=>{
    if(x.g!==6||/[+]/.test(x.w)||!x.ez)return null;
    const ps=keyParts(x.w);if(!ps.length)return null;
    let t=x.ez,from=0;
    for(const p of ps){const i=t.indexOf(p,from);if(i<0)return null;t=t.slice(0,i)+'（　　）'+t.slice(i+p.length);from=i+4;}
    const multi=/…/.test(x.w);
    let wrong;
    if(multi){
      wrong=g6.filter(y=>y.w!==x.w&&/…/.test(y.w)).map(y=>y.w).concat(MULTI_EXTRA).filter(o=>!keyParts(o).every(p=>x.ez.includes(p)));
    }else{
      wrong=g6.filter(y=>y.w!==x.w&&!/…/.test(y.w)&&!x.ez.includes(y.w)&&!related(y.w,x.w)).map(y=>y.w);
    }
    wrong=sample(uniq(wrong),3);if(wrong.length<3)return null;
    const m=mc(x.w,wrong);
    return {type:'mcq',prompt:t,hint:x.ee||'',options:m.options,answer:m.answer,note:x.w+(x.en?' = '+x.en:''),w:x.w};
  };
  /* ---- grammar part 2: collocations ---- */
  const ALLCOLL=new Set();W.forEach(y=>(y.ex||[]).forEach(e=>ALLCOLL.add(e[0])));
  const collB=x=>{
    if(x.w.length<2||isPat(x.w))return null;
    const c=(x.ex||[]).filter(([a,b])=>b&&a.includes(x.w)&&a!==x.w&&!/[…+（(]/.test(a)&&a.length<=x.w.length+4);
    const cand=shuffle(c.slice());
    for(const [a,b] of cand){
      const i=a.indexOf(x.w),pre=a.slice(0,i),post=a.slice(i+x.w.length);
      if(pre&&post)continue;
      const rem=pre||post;if(!rem||rem.length>3)continue;
      const front=!!pre;
      const pool=[];
      W.forEach(y=>{(y.ex||[]).forEach(([a2])=>{
        if(!a2.includes(y.w)||a2===y.w||/[…+（(]/.test(a2))return;
        const j=a2.indexOf(y.w),p2=a2.slice(0,j),q2=a2.slice(j+y.w.length);
        if(p2&&q2)return;
        const r2=p2||q2;
        if(!r2||r2===rem||r2.length>3||!!p2!==front)return;
        const filled=front?r2+x.w:x.w+r2;
        if(ALLCOLL.has(filled))return;
        if(a2.includes(rem))return;
        pool.push(r2);
      });});
      let wrong=uniq(pool);
      const same=wrong.filter(r=>r.length===rem.length);
      wrong=sample(same.length>=3?same:wrong,3);
      if(wrong.length<3)continue;
      const m=mc(rem,wrong);
      const stem=front?'（　　）'+x.w:x.w+'（　　）';
      return {type:'mcq',prompt:stem,hint:b,options:m.options,answer:m.answer,note:a+' = '+b,w:x.w};
    }
    return null;
  };

  const gConn=pickQ(connB,6);
  const gColl=pickQ(collB,8);

  /* ---- reading: order (3 chunks) ---- */
  const orderB=x=>{
    if(isPat(x.w)||!x.ez||!x.ez.includes(x.w))return null;
    const ch=chunkSentence(x.ez,x.w);if(!ch||ch.length!==3)return null;
    const {frags,idx}=shuffledFrags(ch);
    const ans=ch.map((_,k)=>L[idx.indexOf(k)]).join('');
    return {type:'order',frags,answer:ans,model:x.ez,note:x.ee||'',w:x.w};
  };
  const rOrder=pickQ(orderB,4);
  /* ---- writing: build ---- */
  const buildB=(lo,hi)=>x=>{
    if(isPat(x.w)||!x.ez||!x.ez.includes(x.w))return null;
    const ch=chunkSentence(x.ez,x.w);if(!ch||ch.length<lo||ch.length>hi)return null;
    const {frags}=shuffledFrags(ch);
    return {type:'build',frags,answers:[ch.join('')],model:x.ez,note:x.ee||'',w:x.w};
  };
  let wBuild=pickQ(buildB(4,6),5);
  if(wBuild.length<5)wBuild=wBuild.concat(pickQ(buildB(3,3),5-wBuild.length));

  /* ---- reading: cloze with word bank (2 blocks of 5) ---- */
  const clozeB=x=>{
    if(x.w.length<2||isPat(x.w)||!x.ez)return null;
    const t=clozeText(x.ez,x.w);if(!t)return null;
    return {text:t,hint:x.ee||'',note:x.w+(x.en?' = '+x.en:''),w:x.w,ez:x.ez};
  };
  const bankBlock=items=>{
    if(!items.length)return null;
    const ans=items.map(i=>i.w);
    const dis=sample(W.filter(y=>y.w.length>=2&&y.w.length<=4&&!isPat(y.w)&&!used.has(y.w)&&!ans.some(a=>related(a,y.w))&&!items.some(i=>i.ez.includes(y.w))),1);
    const bank=shuffle(ans.concat(dis.map(d=>d.w)));
    items.forEach(i=>{i.answer=bank.indexOf(i.w);});
    return {bank,items:items.map(i=>({text:i.text,hint:i.hint,note:i.note,w:i.w,answer:i.answer}))};
  };
  const c1=pickQ(clozeB,5),c2=pickQ(clozeB,5);
  const clozeBlocks=[bankBlock(c1),bankBlock(c2)].filter(Boolean);

  /* ---- listening ---- */
  const sentB=x=>hasS(x)&&x.ez.length>=6&&!x.w.includes('+')?x:null;
  const lis=pickQ(sentB,10);
  const flags=shuffle([true,true,true,false,false]);
  const tf=lis.slice(0,5).map((x,i)=>{
    const t=flags[i];
    if(i<3){
      let X=x.w;
      if(!t){
        const alt=sample(W.filter(y=>y.w!==x.w&&y.w.length>=2&&!isPat(y.w)&&!x.ez.includes(y.w)&&!related(y.w,x.w)),1)[0];
        X=alt?alt.w:null;
        if(!X)return {type:'tf',audio:x.ez,text:'句子里有“'+x.w+'”这个词。',answer:true,tr:x.ee,note:'“'+x.w+'” = '+x.en,w:x.w};
      }
      return {type:'tf',audio:x.ez,text:'句子里有“'+X+'”这个词。',answer:t,tr:x.ee,note:t?'“'+x.w+'” = '+x.en:'句子里的词是“'+x.w+'”（'+x.en+'）。',w:x.w};
    }
    let ee=x.ee;
    if(!t){const o=sample(W.filter(y=>y.ee&&y.w!==x.w),1)[0];if(o)ee=o.ee;else{}}
    const real=ee===x.ee;
    return {type:'tf',audio:x.ez,text:'这句话的意思是：'+ee,answer:real,tr:x.ee,note:real?'':'Not matching the sentence you heard.',w:x.w};
  });
  const lmc=lis.slice(5).map(x=>{
    const wrong=sample(W.filter(y=>y.ee&&y.w!==x.w),3).map(y=>y.ee);
    const m=mc(x.ee,wrong);
    return {type:'mcq',audio:x.ez,prompt:'你听到的句子，意思最接近哪一个？',options:m.options,answer:m.answer,tr:x.ee,note:x.w+(x.en?' = '+x.en:''),w:x.w};
  });

  /* ---- reading part 3: meaning in context ---- */
  const ctx=pickQ(x=>{
    if(!hasS(x)||!x.en||isPat(x.w))return null;
    const wrong=sample(W.filter(y=>y.en&&y.w!==x.w&&y.en!==x.en),3).map(y=>y.en);
    if(wrong.length<3)return null;
    const m=mc(x.en,wrong);
    return {type:'mcq',prompt:'阅读句子：'+x.ez+'　“'+x.w+'”的意思是：',options:m.options,answer:m.answer,note:x.ee,w:x.w};
  },4);

  /* ---- writing part 2: make a sentence ---- */
  const wSent=pickQ(x=>{
    if(x.w.includes('+'))return null;
    const ps=keyParts(x.w);if(!ps.length)return null;
    return {type:'write',prompt:'请用“'+x.w.replace(/\+/g,'…')+'”写一个句子。',hint:[x.w],keys:ps,minLen:8,model:x.ez||'',w:x.w};
  },5);

  /* ---- translation ---- */
  const t1=pickQ(x=>{
    if(!hasS(x)||isPat(x.w))return null;
    return {type:'write',prompt:x.ee,latin:true,keys:keyParts(x.w),minLen:6,model:x.ez,w:x.w};
  },6);
  const t2=pickQ(x=>{
    if(!hasS(x)||isPat(x.w))return null;
    const wrong=sample(W.filter(y=>y.ee&&y.w!==x.w),3).map(y=>y.ee);
    const m=mc(x.ee,wrong);
    return {type:'mcq',prompt:x.ez,options:m.options,answer:m.answer,note:x.w+(x.en?' = '+x.en:''),w:x.w};
  },5);
  const t3=pickQ(x=>{
    if(!x.en||isPat(x.w))return null;
    const L0=x.w.length;
    let pool=W.filter(y=>y.w!==x.w&&!isPat(y.w)&&Math.abs(y.w.length-L0)<=1&&!related(y.w,x.w));
    const wrong=sample(pool,3).map(y=>y.w);if(wrong.length<3)return null;
    const m=mc(x.w,wrong);
    return {type:'mcq',prompt:'“'+x.en+'”用汉语怎么说？',options:m.options,answer:m.answer,note:x.w+'　'+x.p,w:x.w};
  },5);

  const nS=x=>!hasS(x)&&x.en&&!x.w.includes('+');
  const wrongEn=x=>sample(W.filter(y=>y.en&&y.en!==x.en&&y.w!==x.w),3).map(y=>y.en);
  const wl1=pickQ(x=>{if(!nS(x))return null;let e=x.en;const t=Math.random()<.5;
    if(!t){const o=sample(W.filter(y=>y.en&&y.en!==x.en&&y.w!==x.w),1)[0];if(!o)return null;e=o.en;}
    return {type:'tf',audio:x.w,text:'你听到的词的意思是：'+e,answer:t,tr:x.p+' = '+x.en,note:x.w+'　'+x.p+' = '+x.en,w:x.w};},5);
  const wl2=pickQ(x=>{if(!nS(x))return null;const wr=wrongEn(x);if(wr.length<3)return null;const m=mc(x.en,wr);
    return {type:'mcq',audio:x.w,prompt:'你听到的词，意思是哪一个？',options:m.options,answer:m.answer,tr:x.p+' = '+x.en,note:x.w+'　'+x.p,w:x.w};},5);
  const rw1=pickQ(x=>{if(!nS(x))return null;const wr=wrongEn(x);if(wr.length<3)return null;const m=mc(x.en,wr);
    return {type:'mcq',prompt:'“'+x.w+'”的意思是：',options:m.options,answer:m.answer,note:x.w+'　'+x.p,w:x.w};},6);
  const rw2=pickQ(x=>{if(!nS(x)||!x.p)return null;const wr=sample(W.filter(y=>y.p&&y.p!==x.p&&y.w!==x.w),3).map(y=>y.p);if(wr.length<3)return null;const m=mc(x.p,wr);
    return {type:'mcq',prompt:'“'+x.w+'”的拼音是：',options:m.options,answer:m.answer,note:x.w+' = '+x.en,w:x.w};},5);
  const part=(list)=>list.filter(p=>p.blocks.some(b=>b.items.length));

const LK='hsk-lessons-v1';
let LS={list:[]};
try{const r=localStorage.getItem(LK);if(r){const o=JSON.parse(r);if(o&&Array.isArray(o.list))LS=o;}}catch(e){}
const lsave=()=>{try{localStorage.setItem(LK,JSON.stringify(LS));return true;}catch(e){return false;}};
const EXT=[];
EXT_RAW.split('\n').forEach(line=>{line=line.trim();if(!line)return;const [w,p,en,ez,ee,ex]=line.split('|');EXT.push({w,p,en,ez,ee,ex:parseEx(ex)});});
const snapW=(x,src)=>({w:x.w,p:x.p||'',en:x.en||'',ez:x.ez||'',ee:x.ee||'',ex:x.ex||[],src});
const gmark=s=>esc(s).replace(/【(.*?)】/g,'<mark>$1</mark>');
const gplain=s=>s.replace(/[【】]/g,'');

function lessonQ(x,kind,pool){
  if(kind==='cloze'&&x.ez&&x.w.length>=2&&!isPat(x.w)){
    const t=clozeText(x.ez,x.w);
    if(t){
      const dis=sample(pool.filter(y=>y.w!==x.w&&y.w.length>=2&&!isPat(y.w)&&!x.ez.includes(y.w)&&!related(y.w,x.w)),3);
      if(dis.length===3){const m=mc(x.w,dis.map(y=>y.w));return {prompt:t,hint:x.ee,options:m.options,answer:m.answer,note:x.w+'　'+x.p+' = '+x.en,w:x.w};}
    }
  }
  if(!x.en)return null;
  const dis=sample(pool.filter(y=>y.en&&y.w!==x.w&&y.en!==x.en),3);
  if(dis.length<3)return null;
  const m=mc(x.en,dis.map(y=>y.en));
  return {prompt:'“'+x.w+'”'+(x.p?'（'+x.p+'）':'')+'的意思是：',hint:'',options:m.options,answer:m.answer,note:x.ez?x.ez+' — '+x.ee:'',w:x.w,latin:true};
}
function gramQ(g,k){
  const [s,en]=g.ex[k%g.ex.length];
  let pool=GRAM.filter(y=>y.p!==g.p&&y.f!==g.f);
  if(pool.length<3)pool=GRAM.filter(y=>y.p!==g.p);
  const m=mc(g.p,sample(pool,3).map(y=>y.p));
  return {prompt:s.replace(/【.*?】/g,'（　　）'),hint:en+'　（选择正确的句型）',options:m.options,answer:m.answer,note:g.p+' = '+g.m,w:null};
}
function makeLesson(){
  const n=LS.list.length+1;
  const taught=new Set();LS.list.forEach(l=>l.words.forEach(x=>taught.add(x.w)));
  const recent=new Set();LS.list.slice(-5).forEach(l=>l.words.forEach(x=>recent.add(x.w)));
  const W=allWords(),have=new Set(W.map(x=>x.w));
  const gl=W.filter(x=>!taught.has(x.w)&&['new','bad'].includes(status(x.w)[1])).sort((a,b)=>(status(b.w)[1]==='bad')-(status(a.w)[1]==='bad'));
  const ex=EXT.filter(x=>!have.has(x.w)&&!taught.has(x.w));
  let g=gl.slice(0,5),e=ex.slice(0,3),need=8-g.length-e.length;
  if(need>0){const gx=gl.slice(g.length,g.length+need);g=g.concat(gx);need-=gx.length;}
  if(need>0){const ex2=ex.slice(e.length,e.length+need);e=e.concat(ex2);need-=ex2.length;}
  let words=g.map(x=>snapW(x,x.custom?'custom':'glossary')).concat(e.map(x=>snapW(x,'ext')));
  if(need>0){
    const chosen=new Set(words.map(x=>x.w));
    weightedOrder(W.filter(x=>!recent.has(x.w)&&!chosen.has(x.w))).slice(0,need).forEach(x=>words.push(snapW(x,'glossary')));
  }
  const nw=new Set(words.map(x=>x.w));
  /* spaced review of earlier lessons */
  let rv=[];
  [1,3,7,14,30].forEach(o=>{const l=LS.list[LS.list.length-o];if(l)sample(l.words,2).forEach(x=>rv.push(Object.assign({},x)));});
  rv=rv.filter((x,i)=>!nw.has(x.w)&&rv.findIndex(y=>y.w===x.w)===i);
  if(rv.length<4){
    const have2=new Set(rv.map(x=>x.w));
    sample(W.filter(x=>status(x.w)[1]==='bad'&&!nw.has(x.w)&&!have2.has(x.w)),4-rv.length).forEach(x=>rv.push(snapW(x,'glossary')));
  }
  rv=rv.slice(0,5);
  /* grammar */
  const gi=(n-1)%GRAM.length,gram=JSON.parse(JSON.stringify(GRAM[gi]));
  /* quiz */
  const pool=W.concat(EXT);
  const quiz=[];
  const add=q=>{if(q)quiz.push(q);};
  shuffle(words.slice()).forEach((x,i)=>add(lessonQ(x,i<4?'cloze':'meaning',pool)));
  quiz.splice(6);
  sample(rv,2).forEach(x=>add(lessonQ(x,'cloze',pool)));
  add(gramQ(gram,0));add(gramQ(gram,1));
  const l={id:'L'+Date.now()+'_'+n,no:n,date:todayStr(),created:Date.now(),gi,gram,words,review:rv,quiz,ans:{},done:false,score:null};
  LS.list.push(l);lsave();
  return l;
}
function ensureToday(){
  if(!LS.list.some(l=>l.date===todayStr())){try{makeLesson();}catch(e){console.error(e);}}
}
function streak(){
  const done=new Set(LS.list.filter(l=>l.done).map(l=>l.date));
  let d=new Date(),c=0;
  if(!done.has(todayStr(d)))d.setDate(d.getDate()-1);
  while(done.has(todayStr(d))){c++;d.setDate(d.getDate()-1);}

}
function addToVocab(x){
  if(allWords().some(a=>a.w===x.w))return false;
  VP.custom.unshift({w:x.w,p:x.p,en:x.en,ez:x.ez,ee:x.ee,ex:x.ex});

}
function applyLesson(l){
  if(l.applied)return;l.applied=true;
  const known=new Set(allWords().map(x=>x.w));
  l.words.forEach(x=>{if(known.has(x.w)){const p=pg(x.w);setp(x.w,{seen:Math.max(1,p.seen)});}});
  l.quiz.forEach((q,i)=>{
    if(!q.w||!known.has(q.w)||l.ans[i]===undefined)return;
    const p=pg(q.w);
    if(l.ans[i]===q.answer){if(l.review.some(r=>r.w===q.w)){const box=Math.min(4,p.box+1);setp(q.w,{box,seen:p.seen+1,flag:box>=3?false:p.flag});}}
    else setp(q.w,{flag:true,box:0,seen:p.seen+1});
  });
}

function quizEl(l,after){

function parseLesson(txt){

  if(a<0||b<a)throw new Error('The answer was not valid JSON — press “Try again”.');
  const o=JSON.parse(t.slice(a,b+1));
  if(o.error)return {error:String(o.error)};
  const arr=x=>Array.isArray(x)?x:[],s=x=>x==null?'':String(x);
  const ex=e=>({zh:s(e.zh),pinyin:s(e.pinyin),en:s(e.en)});
  const L={
    title:s(o.title),source_text:s(o.source_text).slice(0,1500),summary:s(o.summary),level:s(o.level),
    vocabulary:arr(o.vocabulary).filter(v=>v&&v.word).map(v=>({word:s(v.word),pinyin:s(v.pinyin),pos:s(v.pos),meaning:s(v.meaning),level:s(v.level),example_zh:s(v.example_zh),example_pinyin:s(v.example_pinyin),example_en:s(v.example_en),collocations:arr(v.collocations).filter(c=>c&&c.zh).map(ex)})),
    grammar:arr(o.grammar).filter(g=>g&&g.pattern).map(g=>({pattern:s(g.pattern),meaning:s(g.meaning),structure:s(g.structure),explanation:s(g.explanation),from_source:s(g.from_source),examples:arr(g.examples).filter(e=>e&&e.zh).map(ex),mistakes:s(g.mistakes)})),
    expressions:arr(o.expressions).filter(e=>e&&e.zh).map(e=>({zh:s(e.zh),pinyin:s(e.pinyin),en:s(e.en),usage:s(e.usage),example_zh:s(e.example_zh),example_pinyin:s(e.example_pinyin),example_en:s(e.example_en)}))
  };
  if(!L.vocabulary.length&&!L.grammar.length)throw new Error('The lesson came back empty — press “Try again”.');

/* ---- no-AI fallback: a basic lesson from the site's own dictionary ---- */
function offlineLesson(text){
  const runs=(text.match(/[\u4e00-\u9fff]+/g)||[]);
  const src=runs.join('，');
  if(src.replace(/，/g,'').length<2)return {error:'no_chinese_text'};
  const dict=new Map();
  allWords().concat(EXT).forEach(x=>{if(x.w&&!isPat(x.w)&&!dict.has(x.w))dict.set(x.w,x);});
  const maxL=Math.min(8,Math.max(2,...[...dict.keys()].map(k=>k.length)));
  const found=[],seen=new Set();
  runs.forEach(run=>{
    let i=0;
    while(i<run.length){
      let hit=null;
      for(let n=Math.min(maxL,run.length-i);n>=2;n--){const w=run.substr(i,n);if(dict.has(w)){hit=w;break;}}
      if(hit){if(!seen.has(hit)){seen.add(hit);found.push(dict.get(hit));}i+=hit.length;}else i++;
    }
  });
  const grammar=GRAM.filter(g=>{
    const parts=keyParts(g.p);if(parts.length<2)return false;
    let pos=0;for(const p of parts){const k=src.indexOf(p,pos);if(k<0)return false;pos=k+p.length;}return true;
  }).map(g=>({pattern:g.p,meaning:g.m,structure:'',explanation:g.n,from_source:'',examples:g.ex.map(([s,en])=>({zh:s.replace(/[【】]/g,''),pinyin:'',en})),mistakes:''}));
  const vocabulary=found.slice(0,20).map(x=>({word:x.w,pinyin:x.p||'',pos:'',meaning:x.en||'',level:'',example_zh:x.ez||'',example_pinyin:'',example_en:x.ee||'',collocations:(x.ex||[]).map(([a,b])=>({zh:a,pinyin:'',en:b}))}));
  const expressions=[];
  found.forEach(x=>(x.ex||[]).forEach(([a,b])=>{if(expressions.length<8)expressions.push({zh:a,pinyin:'',en:b,usage:'',example_zh:'',example_pinyin:'',example_en:''});}));
  if(!vocabulary.length&&!grammar.length)return {error:'nothing_known'};
  return {title:src.slice(0,14),source_text:src.slice(0,1500),summary:'Basic lesson: it only covers words and grammar patterns that already exist in this site’s own dictionary. Connect an AI (see the settings on the Resources page) for a full breakdown of any text.',level:'',vocabulary,grammar,expressions,basic:true};
}

      if(eng&&!text&&engineImgs()){r.msg='Reading the photo…';refreshRes();L=parseLesson(await callAI(lessonPrompt('photo'),r.img));}
      else if(eng&&text){r.msg='Writing the lesson…';refreshRes();L=parseLesson(await callAI(lessonPrompt('text',text)));}
      else if(text){L=offlineLesson(text);}
      else{r.status='needtext';r.error=eng?'This AI setup cannot read photos. Type or paste the Chinese text from the photo to get a lesson.':'No AI is connected, so the photo cannot be read automatically. Type or paste the Chinese text from the photo (or connect an AI in the settings above).';}
    }else{
      if(!text){r.msg='Reading the page…';refreshRes();text=await fetchPageText(r.url);if(text)r.text=text;}
      if(!text){r.status='needtext';r.error='The page could not be read automatically (the site blocks it, or this page is offline). Copy the text of the page and paste it here.';}
      else if(eng){r.msg='Writing the lesson…';refreshRes();L=parseLesson(await callAI(lessonPrompt('text',text)));}
      else{L=offlineLesson(text);}
    }
    if(L&&L.error){
      if(L.error==='no_chinese_text'){r.status='error';r.error='No readable Chinese text was found in this '+(r.type==='photo'?'photo':'page')+'.';}
      else{r.status='error';r.error='None of the words in this text are in the built-in dictionary. Connect an AI in the settings above for a full lesson.';}
    }else if(L){
      let host='';try{host=new URL(r.url).hostname;}catch(e){}
      const les=Object.assign({id:'RL'+r.id,resId:r.id,created:Date.now(),kind:r.type,lang:RSET.lang},L);
      if(!les.title)les.title=r.type==='photo'?'Photo lesson':(host||'Link lesson');
      const i=RLES.findIndex(x=>x.id===les.id);if(i>=0)RLES[i]=les;else RLES.push(les);
      await rdbPut('lessons',les);
      r.status='ready';r.lessonId=les.id;r.title=les.title;
    }
  }catch(e){
    console.error(e);r.status='error';r.error=aiErrorText(e);
  }finally{
    RWORK.delete(r.id);r.msg='';await saveRes(r);refreshRes();
  }
}
function enqueue(r,userText,force){RQ=RQ.then(()=>processRes(r,userText,force)).catch(()=>{});return RQ;}
async function addPhotos(files){
  const list=Array.from(files||[]).filter(f=>/^image\//.test(f.type)||/\.(jpe?g|png|webp|gif|heic|heif|bmp)$/i.test(f.name||''));
  if(!list.length){rmsg('Please choose an image file.',true);return;}
  rmsg('Adding '+list.length+' photo'+(list.length>1?'s':'')+'…');
  let n=0;
  for(const f of list){
    try{
      const p=await prepImage(f);
      const r={id:rid(),type:'photo',created:Date.now(),name:f.name||'photo',img:p.img,thumb:p.thumb,status:'queued',error:'',text:''};
      RES.unshift(r);await saveRes(r);refreshRes();enqueue(r);n++;
    }catch(e){rmsg('Could not read “'+(f.name||'file')+'” as an image.',true);}
  }
  if(n)rmsg(n+' photo'+(n>1?'s':'')+' added — lessons are being created.');
}
function addLink(raw){
  let u=String(raw||'').trim();

  if(!/^https?:\/\//i.test(u))u='https://'+u;
  let host='';try{host=new URL(u).hostname;}catch(e){rmsg('That does not look like a valid link.',true);return false;}
  const r={id:rid(),type:'link',created:Date.now(),url:u,title:host,status:'queued',error:'',text:''};
  RES.unshift(r);saveRes(r);refreshRes();enqueue(r);
  rmsg('Link added — the lesson is being created.');return true;
}
function addText(raw){
  const t=String(raw||'').trim();
  if(t.replace(/[^\u4e00-\u9fff]/g,'').length<2){rmsg('Paste some Chinese text first.',true);return false;}
  const r={id:rid(),type:'text',created:Date.now(),url:'',title:t.replace(/\s+/g,' ').slice(0,24),status:'queued',error:'',text:t.slice(0,6000)};

const parseQ=x=>{const a=x.split('|');return {type:'mcq',prompt:a[0],options:a.slice(1,5),answer:+a[5]};};
function buildCsca(type){
  const D=type==='hum'?CH:CT,secs=[];
  const add=(t,n,items,extra)=>secs.push({id:'c'+secs.length,zh:t,en:'',intro:n,parts:[P(t,n,items,extra)]});
  D.forEach(p=>{
    if(p.bank){
      const its=p.all?p.items:shuffle(p.items.slice()).slice(0,p.k);
      add(p.t,p.n,its.map(x=>({text:x[0],answer:x[1]})),{bank:p.bank,passage:p.passage});
    }else if(p.pass)add(p.t,p.n,p.q.map(parseQ),{passage:p.pass});
    else add(p.t,p.n,shuffle(p.q.slice()).slice(0,p.k).map(parseQ));
  });
  if(type==='tech'){
    const g=shuffle(CGL.slice()).slice(0,6);
